resume: true

stateful_tbptt:
  chunk_size: 2048
  detach_interval_chunks: 1

# Capability suites run after training as independent single-GPU jobs. Keeping
# them outside the active process group avoids rank-0 benchmark/NCCL timeouts.
checkpoint_benchmarks:
  enabled: false
  output_dir: runs/q8_cpbc_r125_250m_dp_u1_c2048_per_head_d32_ddp2_legacyval/benchmarks
  label: q8_cpbc_r125_250m_dp_u1_c2048_per_head_d32_ddp2_legacyval

post_train_benchmarks:
  enabled: false

wandb:
  group: q8_cpbc_per_head_dp_c2048_r125_250m
