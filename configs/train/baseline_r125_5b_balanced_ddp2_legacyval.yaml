extends: corrected_package_a_r125_5b_baseline.yaml
run_name: baseline_r125_5b_balanced_ddp2_legacyval
data_config: ../data/r125_main_5b_balanced.yaml

batch_size: 16
gradient_accumulation_steps: 1
expected_world_size: 2
expected_global_batch_size: 32
eval_split: val_legacy
float32_matmul_precision: high
ddp_find_unused_parameters: false
ddp_broadcast_buffers: false

checkpoint_retention:
  enabled: true
  interval: 5000
  keep_last: 20
  include_optimizer: false
  include_rng_state: false

checkpoint_benchmarks:
  enabled: true
  interval: 15000
  output_dir: reports/package_a_benchmarks
  label: baseline_r125_5b_balanced_ddp2_legacyval
  fail_on_error: false
  reasoning:
    enabled: true
    config: configs/eval/reasoning_eval_s600.yaml
  public:
    enabled: true
    config: configs/eval/public_benchmark_s600.yaml

post_train_benchmarks:
  label: baseline_r125_5b_balanced_ddp2_legacyval

wandb:
  group: r125_5b_balanced_legacyval_comparison
  tags:
    - baseline
    - plain_transformer
    - r125
    - 5b
    - balanced_data
    - legacy_val
    - ddp2
    - local_batch16
    - global_batch32
